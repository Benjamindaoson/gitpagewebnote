<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="admin-token" content="__ADMIN_TOKEN__"><title>本地笔记管理台</title><style>body{max-width:900px;margin:0 auto;padding:32px;font:16px system-ui;background:#f8fafc;color:#172033}h1{margin-bottom:4px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:20px;margin:18px 0}.drop{padding:32px;border:2px dashed #7193c4;border-radius:12px;text-align:center;cursor:pointer}.drop.drag{background:#eff6ff}label{display:block;margin:12px 0;font-weight:600}input,select,textarea{display:block;width:100%;box-sizing:border-box;margin-top:5px;padding:9px;border:1px solid #b9c8db;border-radius:7px;font:inherit}textarea{min-height:80px}fieldset{border:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}button{border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:700;background:#2563eb;color:#fff;cursor:pointer;margin:5px 7px 0 0}button.secondary{background:#475569}button.publish{background:#047857}pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;padding:14px;border-radius:9px}.hint{color:#52627a}</style></head><body><h1>本地笔记管理台</h1><p class="hint">只在你的电脑 <code>127.0.0.1</code> 运行；文件不会上传到外部服务。</p><section class="card"><div id="drop" class="drop">拖入包含 Markdown 和图片的文件夹，或点击选择文件夹<input id="folder" type="file" webkitdirectory multiple hidden></div><p id="fileStatus" class="hint">尚未选择文件。</p></section><section id="form" class="card" hidden><h2>导入设置</h2><fieldset><label>要导入的 Markdown<select id="selected"></select></label><label>栏目<select id="category"><option value="python">Python</option><option value="langchain">LangChain</option><option value="langgraph">LangGraph</option><option value="ai-coding">AI Coding</option></select></label><label>标题<input id="title" required></label><label>难度<select id="difficulty"><option value="beginner">入门</option><option value="intermediate">进阶</option><option value="advanced">高级</option></select></label><label>标签（用逗号分隔）<input id="tags"></label><label>发布日期<input id="date" type="date"></label></fieldset><label>摘要<textarea id="description"></textarea></label><button id="preview" class="secondary">查看变更预览</button><button id="draft">导入草稿</button><button id="publish" class="publish">导入并推送发布</button></section><section id="result" class="card" hidden><h2>结果</h2><pre id="output"></pre></section><script>const token=document.querySelector('meta[name="admin-token"]').content;let files=[];const $=id=>document.getElementById(id);const date=new Date().toISOString().slice(0,10);$('date').value=date;function pathOf(f){return f.webkitRelativePath||f.name}function showFiles(list){files=[...list];const md=files.filter(f=>/\.md$/i.test(f.name));$('fileStatus').textContent=`已选择 ${files.length} 个文件，其中 ${md.length} 个 Markdown。`;$('selected').innerHTML=md.map(f=>`<option value="${pathOf(f)}">${pathOf(f)}</option>`).join('');$('form').hidden=!md.length;if(md.length)fillFromMarkdown(md[0])}async function fillFromMarkdown(file){const text=await file.text();const title=text.match(/^#\s+(.+)$/m)?.[1]||file.name.replace(/\.md$/i,'');const paragraph=text.replace(/^#.+$/gm,'').split(/\n\s*\n/).map(x=>x.trim()).find(x=>x.length>10)||'从本地 Markdown 导入的笔记。';$('title').value=title;$('description').value=paragraph;$('category').value=/langgraph|stategraph/i.test(text)?'langgraph':/langchain/i.test(text)?'langchain':/python|pip/i.test(text)?'python':'ai-coding';$('tags').value=$('category').options[$('category').selectedIndex].text}$('folder').addEventListener('change',e=>showFiles(e.target.files));$('drop').addEventListener('click',()=>$('folder').click());for(const type of ['dragover','dragleave','drop'])$('drop').addEventListener(type,e=>{e.preventDefault();$('drop').classList.toggle('drag',type==='dragover')});$('drop').addEventListener('drop',e=>showFiles(e.dataTransfer.files));$('selected').addEventListener('change',e=>fillFromMarkdown(files.find(f=>pathOf(f)===e.target.value)));async function payload(){return{selectedPath:$('selected').value,files:await Promise.all(files.map(async f=>({path:pathOf(f),base64:btoa(String.fromCharCode(...new Uint8Array(await f.arrayBuffer())))}))),metadata:{title:$('title').value,description:$('description').value,category:$('category').value,tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean),difficulty:$('difficulty').value,date:$('date').value}}}async function request(url,mode){$('result').hidden=false;$('output').textContent='处理中…';const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-admin-token':token},body:JSON.stringify({...await payload(),mode})});const data=await response.json();$('output').textContent=JSON.stringify(data,null,2)}$('preview').onclick=()=>request('/api/preview','draft');$('draft').onclick=()=>request('/api/import','draft');$('publish').onclick=()=>confirm('将创建 Git 提交并推送到 GitHub Pages，确认发布？')&&request('/api/import','publish');</script></body></html>
